name: Bug Report
description: Report a reproducible bug or unexpected system behavior
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting an issue! Please provide reproduction steps and context."
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Concise summary of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Numbered steps to reproduce the issue
      placeholder: |
        1. Navigate to ...
        2. Execute action ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What should have occurred vs what happened
    validations:
      required: true
  - type: input
    id: correlationId
    attributes:
      label: Correlation ID or Request ID (if applicable)
      description: From error message or server log
